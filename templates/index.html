<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ .Title }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .article { border-bottom: 1px solid #ccc; padding: 20px 0; margin-bottom: 20px; }
        .metrics { background-color: #f5f5f5; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
<h1>Анализ тональности текста</h1>

{{ range .Articles }}
<article class="article">
    <h2>{{ .Title }}</h2>
    <div class="metrics">
        <strong>Тональность:</strong> {{ .SentimentScore }}
        <br>
        <strong>Язык:</strong> {{ .DetectedLanguage }}
        <br>
        <strong>Стилистические особенности:</strong>
        <pre>{{ .StylisticFeatures }}</pre>
    </div>

    <div class="content">
        {{ .Content }}
    </div>
</article>
{{ end }}
</body>
</html>
